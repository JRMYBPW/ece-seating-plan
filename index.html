<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECE Dinner Seating Plan</title>
 
<style>
body{
    font-family: Arial,sans-serif;
    max-width:1200px;
    margin:auto;
    padding:20px;
    background:#f7f7f7;
}
 
h1,h2{
    text-align:center;
}
 
.search-box{
    text-align:center;
    margin:30px;
}
 
input{
    width:350px;
    max-width:90%;
    padding:12px;
    font-size:18px;
}
 
#result{
    text-align:center;
    margin-top:20px;
    color:#004080;
}
 
.result-item{
    font-size:22px;
    font-weight:bold;
    margin-bottom:18px;
}
 
.result-item small{
    display:block;
    font-size:18px;
    color:#666;
    font-weight:normal;
    margin-top:4px;
}
 
.no-result{
    font-size:18px;
    color:#a00;
}
 
.tables{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}
 
.table-card{
    background:white;
    border-radius:10px;
    padding:15px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}
 
.table-card h3{
    margin-top:0;
    color:#004080;
}
 
ul{
    padding-left:18px;
}
</style>
 
</head>
<body>
 
<div style="text-align:center;margin-bottom:20px;">
    <img src="./bunge.png" alt="Bunge" style="width:300px;max-width:80%;">
</div>
 
<h1>ECE Dinner Seating Plan</h1>
 
<div class="search-box">
    <input type="text" id="search" placeholder="Type your name..." oninput="findGuest()" autocomplete="off">
</div>
 
<div id="result"></div>
 
<h2>Full Seating Plan</h2>
 
<div class="tables" id="tables"></div>
 
<script>
 
// Single source of truth: the guest search list is built from this object.
const tables = {
1:["Aneta Babirádová","Janos Nemeth","Jaroslaw Hron","Pavlína Zajíčková"],
2:["Lubos Chladny","Edit Meszaros","Yvon Pennors","Hubert Francois","Cyprien Lorain","Nicolas Coudry"],
3:["Adrien Gragy","Andrii Paladii","Anna Kugat","Iryna Taran","Olga Tsymbaliuk","Tetiana Genkina"],
4:["Mate Biricksai","L. Shvets","D. Artiushenko","K.v.Yukhymenko","Eoin Walsh","Lucas Dorrestein"],
5:["Ariel Handler","Ben Fraser","Jean-Baptiste Faulque","Maarten Ten Doesschate","Ryan McAuley","Senjin Yang"],
6:["David Wylie","Joey Tulling","James Maw","Marcus Sommerfeldt","Jonathan Sherrard","Nick Williams"],
7:["Janos Graszli","Nikola Rajkovic","Othmar Sorger","Vladimr Milosevic"],
8:["Gabriel Tejerina","Jaume Airmany","Miguel Costa","Rafael Olaso"],
9:["Martin Boekhoud","Kasper Landheer","Kevin Tromp","Thierry Cardon","Rody Smal","Isa Fahkri"],
10:["Augusto Aki Filho","Lukas van Behr","Tijn Roskamp","Marien Klomp","Arno Boersma","Jaap de Graaf","Peter Brennecke"],
11:["Cornel Boere","Dimitri Vos","Charley McAllister","Jan Hartvig Nielsen","John Bergin","Peter Visscher","Philip Lynch","Xavier van de Avenne"],
12:["Paul Stam","Tom Boots","Floris Scheurleer","Franz Mantler","Ben Samyn","Luis Camps","Rutger van der Hoeven"],
13:["Judyta Szuksztul","Grzegorz Sobczyński","Sebastian Michalak","Stanislaw Agrolok"],
14:["Andrezj Rozycki","Andrii But","Arthur Gnyp (RTD)","Pavlo Melnychuk","Stepan Vorobiov","Taras Kovatsenko"],
15:["Andrea Poma","Eros Focchi","Federico Bernabini","Marco Benedetti","Massimiliano Leone","Rouliot Edouard"],
16:["Alessandro Savoia","Andrea Giaretta","Daniel Fernandez-Manchon","Maria Aranda","Roberto Frione","Saverio Panico"],
17:["Agah Mamahoglu","Burçin Özkan","Muhammed Idin","Sina Ariker","Ufuk Dogan","Yunus Ulukaya"],
18:["Huseyin Taser","Koray Tüysüzoğlu","Mehmet Nour Yusuf","Nil Taşkaldıran Öztürk","Tunca Cengiz","Yusuf Memiş"],
19:["Agnieszka Smarzewska","Marta Kukanauskas","Petr Polak","Remigiusz Bagiński"],
20:["Arkadiusz Wittke","Artur Golebiowski","Jakub Matusiak","Marek Brzozowski"],
21:["Alexandru Neagu","Cristian Mihailescu","Dennis Schorth","Dragan Tomic","Iulian Avram","Milan Roganovic","Mladen Terzic","Todor Stoykov"],
22:["Emam Gad","Ezzat Kadi","Mahmoud Kalila","Mohamed Abou Nader","Mohemed Rashed","Nicolas Chahine","Tamer Khalil","Wael Shabarek"],
23:["Ali Berdai","Dafer Charaf","Habib Hijaj","Ilias Benyahia","Karim Adid","Mme Hijaj","Taoufik Chafli","Youssef Slimani"],
24:["Adil Aleuj","Ahmed Safaa","Amir Wassef","Brahim Ait","Gerald Theis","Kacem Raji","Nader abu el nadar","Wael Abdullah"],
25:["Alexandre Rodo","Apostolos Anthomelidis","Apostolos Kkokkalis","Elad Sror","Eyal Koppel","Farid Christensen","Ms Chaabouni","Nesrine"]
};
 
const MAX_DOWNSTAIRS = 12;
 
function floorOf(table){
    return table <= MAX_DOWNSTAIRS ? "Downstairs" : "Upstairs";
}
 
// Lowercase + remove accents so "ozkan" finds "Özkan", "bagin" finds "Bagiński", etc.
function normalize(str){
    return str
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/ı/g, "i")
        .replace(/ł/g, "l");
}
 
// Build the flat guest list automatically from `tables`
const guestList = [];
for (const t in tables) {
    tables[t].forEach(name => {
        guestList.push({ name: name, table: Number(t), key: normalize(name) });
    });
}
 
function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
}
 
function findGuest(){
    const raw = document.getElementById("search").value.trim();
    const input = normalize(raw);
    const resultDiv = document.getElementById("result");
 
    if (input.length < 2) {
        resultDiv.innerHTML = "";
        return;
    }
 
    // Every word typed must appear in the name (order does not matter)
    const words = input.split(/\s+/);
    const matches = guestList.filter(g => words.every(w => g.key.includes(w)));
 
    if (matches.length === 0) {
        resultDiv.innerHTML = '<div class="no-result">No guest found. Please check the spelling.</div>';
        return;
    }
 
    resultDiv.innerHTML = matches.slice(0, 10).map(g =>
        `<div class="result-item">${escapeHtml(g.name)}
            <small>Table ${g.table} &ndash; ${floorOf(g.table)}</small>
        </div>`
    ).join("");
 
    if (matches.length > 10) {
        resultDiv.innerHTML += "<div>Too many results, please type more letters.</div>";
    }
}
 
// Full seating plan
const container = document.getElementById("tables");
let html = "";
 
for (let table = 1; table <= 25; table++) {
    const people = tables[table] || [];
 
    html += `<div class="table-card">
        <h3>Table ${table}</h3>
        <p><strong>${floorOf(table)}</strong></p>
        <ul>${people.map(p => `<li>${escapeHtml(p)}</li>`).join("")}</ul>
    </div>`;
}
 
container.innerHTML = html;
 
</script>
 
</body>
</html>
